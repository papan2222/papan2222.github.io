    <section id="quotes" aria-label="名言一覧">

 <script>
/* ===== Quotes page - drop-in script (2025-08-25) ===== */
(function(){
  // ---- state ----
  let QUOTES_RAW = [];
  let AUTHORS = {};
  let QUOTES_SHUFFLED = [];
  let CURRENT_FILTER = null;
  let PAGE = 1, QUERY = ""; const PAGE_SIZE = 50;

  // ---- utils ----
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
  const uniqAuthors = data => [...new Set(data.map(q => (q.author||'Unknown').trim()))].sort((a,b)=>a.localeCompare(b));

  // ---- DOM refs ----
  let listEl, authorsEl, stripEl, filterBar, errEl;

  document.addEventListener('DOMContentLoaded', init);

  function init(){
    listEl    = document.getElementById('q-list');
    authorsEl = document.getElementById('authors-grid');
    stripEl   = document.getElementById('authors-strip');
    filterBar = document.getElementById('filter-bar');
    errEl     = document.getElementById('quotes-error');

    // ルート直下の JSON を取得（キャッシュ回避付き）
    const url = '/quotes.json?v=' + Date.now();
    Promise.all([fetch(url, { cache: 'no-store' }).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),fetch('/quotes/authors.json').then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([raw,authors])=>{AUTHORS=authors;return raw;})
      .then(normalizeData)   // キー名の揺れを吸収
      .then(setupUI)
      .catch(showError);
  }

  // いろいろなキー名に対応（en/english、jp/ja/japanese 等）
  function normalizeData(raw){
    const arr = Array.isArray(raw) ? raw : (raw.quotes || []);
    return arr.map(it => ({
      id: String(it.id || ''),
      tips: Array.isArray(it.tips) ? it.tips.map(String) : [],
      en:     String(it.en || it.english || it.quote_en || it.text_en || '').trim(),
      jp:     String(it.jp || it.ja || it.japanese || it.quote_ja || it.text_ja || '').trim(),
      sourceStatus: String(it.sourceStatus || ''),
      source: String(it.source || ''),
      sourceUrl: String(it.sourceUrl || ''),
      author: String(it.author || it.by || it.writer || 'Unknown').trim()
    })).filter(q => q.en && q.jp);
  }

  function setupUI(data){
    QUOTES_RAW = data;
    const search = document.getElementById("quote-search");
    search.addEventListener("input",()=>{QUERY=search.value.trim().toLowerCase();PAGE=1;updateUI();});
    document.getElementById("search-clear").onclick=()=>{search.value="";QUERY="";PAGE=1;updateUI();};
    const go=p=>{PAGE=p;updateUI();document.getElementById("quotes").scrollIntoView({block:"start"});};
    document.getElementById("quote-prev").onclick=()=>go(PAGE-1);
    document.getElementById("quote-next").onclick=()=>go(PAGE+1);
    document.getElementById("quote-page").onchange=e=>go(Number(e.target.value));
    QUOTES_SHUFFLED = shuffle([...QUOTES_RAW]);

    const names = uniqAuthors(QUOTES_RAW);
    if (authorsEl) renderAuthors(authorsEl, names);
    if (stripEl)   renderAuthors(stripEl,   names);

    // シャッフルボタン（もし存在すれば）
    const btn = document.getElementById('btn-shuffle');
    if (btn) btn.addEventListener('click', () => {
      QUOTES_SHUFFLED = shuffle([...QUOTES_RAW]);
      CURRENT_FILTER = null;
      highlightAuthor(null);
      PAGE=1; updateUI();
    });

    CURRENT_FILTER = null;
    updateUI();
  }

  function renderQuotes(target, data){
    if (!target) return;
    if (!data.length){
      target.innerHTML = '<p style="opacity:.7">該当する名言がありません。</p>';
      return;
    }
    target.innerHTML = data.map(q => `
      <article class="quote" role="listitem">
        <div class="q-en">${esc(q.en)}</div>
        <div class="q-jp">${esc(q.jp)}</div>
        <div class="q-author">${esc(AUTHORS[q.author]?.ja || q.author)}${AUTHORS[q.author] ? " ／ "+esc(q.author) : ""}</div>
        ${q.tips.length ? `<details class="q-tip"><summary>ENGLISH TIP</summary><ul>${q.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>` : ""}
        <div class="q-detail"><a href="/quotes/one/?id=${encodeURIComponent(q.id)}" aria-label="個別ページを開く" title="個別ページを開く">↗</a></div>
      </article>
    `).join('');
  }

  function renderAuthors(target, names){
    target.innerHTML = names.map(n =>
      `<div class="author-item"><a href="#quotes" class="chip" data-author="${esc(n)}">${esc(AUTHORS[n]?.ja || n)}</a></div>`
    ).join('');
    // クリックでフィルタ＆スクロール
    target.querySelectorAll('a[data-author]').forEach(a=>{
      a.addEventListener('click', ev=>{
        ev.preventDefault();
        CURRENT_FILTER = ev.currentTarget.dataset.author || null;
        highlightAuthor(CURRENT_FILTER);
        PAGE=1; updateUI();
        const anchor = document.getElementById('quotes');
        if (anchor) anchor.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function getFiltered(list){
    if (!CURRENT_FILTER) return list;
    return list.filter(q => (q.author||'Unknown').trim() === CURRENT_FILTER);
  }

  function renderFilterBar(){
    if (!filterBar) return;
    if (CURRENT_FILTER){
      filterBar.style.display = 'flex';
      filterBar.innerHTML = `<span class="pill">絞り込み：${esc(CURRENT_FILTER)} <button id="clear-filter" aria-label="フィルタ解除">×</button></span>`;
      document.getElementById('clear-filter').onclick = ()=>{
        CURRENT_FILTER = null;
        highlightAuthor(null);
        updateUI();
      };
    }else{
      filterBar.style.display = 'none';
      filterBar.innerHTML = '';
    }
  }

  function highlightAuthor(name){
    document.querySelectorAll('a[data-author]').forEach(a=>{
      if ((name||'') === (a.dataset.author||'')) a.classList.add('active');
      else a.classList.remove('active');
    });
  }

  function updateUI(){
    const src = QUOTES_SHUFFLED.length ? QUOTES_SHUFFLED : QUOTES_RAW;
    const items = getFiltered(src).filter(q=>!QUERY || (q.en+" "+q.jp+" "+q.author+" "+(AUTHORS[q.author]?.ja||"")).toLowerCase().includes(QUERY));
    const pages=Math.max(1,Math.ceil(items.length/PAGE_SIZE)); PAGE=Math.max(1,Math.min(PAGE,pages));
    renderQuotes(listEl, items.slice((PAGE-1)*PAGE_SIZE,PAGE*PAGE_SIZE));
    document.getElementById("quote-count").textContent=items.length+"件 ／ 全"+QUOTES_RAW.length+"件";
    const select=document.getElementById("quote-page");select.innerHTML=Array.from({length:pages},(_,i)=>`<option value="${i+1}">${i+1} / ${pages}</option>`).join("");select.value=String(PAGE);
    document.getElementById("quote-prev").disabled=PAGE<=1;document.getElementById("quote-next").disabled=PAGE>=pages;
    renderFilterBar();
    const profile=document.getElementById("author-profile"), a=AUTHORS[CURRENT_FILTER];profile.hidden=!a;profile.textContent=a ? a.ja+"（"+a.years+"） "+a.bio : "";
  }

  function showError(err){
    console.error(err);
    if (errEl){
      errEl.textContent = 'quotes.json の読み込みに失敗しました: ' + err.message;
      errEl.style.color = 'tomato';
    }
  }
})();
</script>
