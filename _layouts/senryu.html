<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>パンダの英語川柳｜日英対訳と英語学習</title><meta name="description" content="パンダのイラストで楽しむ日英対訳の川柳。作品ごとの英単語・熟語・詩的表現を解説。"><link rel="canonical" href="https://papan2222.github.io/senryu/"><meta property="og:title" content="パンダの英語川柳"><meta property="og:description" content="日英対訳の川柳とENGLISH TIP"><meta property="og:type" content="website"><meta property="og:url" content="https://papan2222.github.io/senryu/"><meta property="og:image" content="https://papan2222.github.io/images/senryu/rain.jpg"><meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark;--bg:#242e38;--panel:#303d48;--ink:#eae3d3;--gold:#b6a17c;--muted:#c4c8ca}*{box-sizing:border-box}body{max-width:960px;margin:0 auto;padding:24px 18px 48px;background:radial-gradient(ellipse at top left,#35434f,transparent 65%),var(--bg);color:var(--ink);line-height:1.8;font-family:system-ui,sans-serif}a{color:var(--gold);text-underline-offset:4px}h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;letter-spacing:.08em;margin:12px 0 4px}h2+p{color:var(--gold);font-family:Georgia,serif;margin-top:0}.home-only{margin-bottom:18px;border-bottom:1px solid #b6a17c55;padding-bottom:10px}.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:800px;margin:24px auto}.card{background:var(--panel);border:1px solid #b6a17c55;border-radius:8px;padding:16px;box-shadow:0 8px 24px #10182040;min-width:0}.card[hidden]{display:none}.card-img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;border-radius:5px;margin:0 auto 18px}.image-link{display:block}.poem{white-space:pre-line;text-align:center;font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(17px,3vw,22px);line-height:1.9;margin:12px 0 18px}.english-tip{border-left:2px solid var(--gold);background:#242e38;padding:10px 14px;border-radius:0 5px 5px 0;font-size:14px}.english-tip summary{cursor:pointer;color:var(--gold);font-size:12px;letter-spacing:.08em}.english-tip ul{margin:8px 0;padding-left:20px}.detail-link{text-align:right;margin-top:6px}.detail-link a{display:inline-flex;min-width:36px;min-height:36px;align-items:center;justify-content:center;font-size:20px;text-decoration:none}.meta{color:var(--muted);font-size:13px}.work-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px auto;max-width:800px}.work-nav a{border:1px solid var(--gold);border-radius:5px;padding:9px 15px;text-decoration:none}.work-nav .random{background:var(--gold);color:var(--bg)}.work-nav[hidden]{display:none}a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:4px}@media(max-width:560px){body{padding:14px 8px 32px}.card{padding:7px}.card-img{margin-bottom:12px}.poem{padding:0 8px}.english-tip{margin:0 4px}.cards{gap:16px}}
</style></head><body><nav class="home-only"><a href="/">Home</a></nav>
{{ content }}
<nav id="work-nav" class="work-nav" aria-label="作品移動" hidden></nav>
<script>
(function(){const cards=Array.from(document.querySelectorAll('.cards > .card[id^="work-"]'));const id=new URLSearchParams(location.search).get('id');if(!id)return;const i=cards.findIndex(c=>c.id==='work-'+id);if(i<0)return;cards.forEach((c,j)=>{c.hidden=j!==i});const card=cards[i],tip=card.querySelector('details');if(tip)tip.open=true;const img=card.querySelector('img');if(img)img.loading='eager';const detail=card.querySelector('.detail-link');if(detail)detail.hidden=true;const link=card.querySelector('.image-link');if(link){link.removeAttribute('href');link.removeAttribute('aria-label')}const nav=document.getElementById('work-nav');nav.hidden=false;function add(label,url,cls){const a=document.createElement('a');a.textContent=label;a.href=url;if(cls)a.className=cls;nav.append(a)}const url=j=>'/senryu/?id='+encodeURIComponent(cards[j].id.slice(5));if(i>0)add('← 前の作品',url(i-1));add('作品一覧','/senryu/');if(i<cards.length-1)add('次の作品 →',url(i+1));if(cards.length>1){const j=Math.floor(Math.random()*(cards.length-1));add('ランダムに次の作品へ',url(j>=i?j+1:j),'random')}const poem=card.querySelector('.poem');if(poem)document.title=poem.textContent.trim().split(/\n/)[0].trim()+' | パンダの英語川柳';})();
</script></body></html>
