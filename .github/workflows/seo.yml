name: Generate SEO pages
on:
  push:
    branches: [main]
    paths:
      - 'pandalife/works.json'
      - 'game/gallery.json'
      - 'seo_generate.py'
      - '.github/workflows/seo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate
        run: |
          python seo_generate.py
          python -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml')"
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml pandalife/works game/works
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update static SEO pages"
          git pull --rebase origin main
          git push origin HEAD:main
