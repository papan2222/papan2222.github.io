name: Update panda audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/gallery.json'
      - 'pandalife/works.json'
      - 'blog/index.md'
      - 'scripts/generate_audio.py'
      - 'scripts/generate_animal_audio.py'
      - 'animalenglish/index.html'
      - 'animalenglish/lessons.json'
      - 'animalenglish/template.html'
      - 'animalenglish/master.tsv'
      - 'scripts/build_animalenglish.py'
      - '.github/workflows/audio.yml'
permissions:
  contents: write
concurrency:
  group: panda-audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_animalenglish.py
      - run: python scripts/generate_audio.py
      - name: Generate Animal English MP3
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y; $env:Path += ';C:\ProgramData\chocolatey\bin' }
          python scripts/generate_animal_audio.py
      - name: Save audio
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio animalenglish/audio animalenglish/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Automatically update panda audio"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin main
          exit $LASTEXITCODE
