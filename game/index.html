<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダのゲーム世界 | Panda's Gaming World</title><meta name="description" content="パンダがゲームの世界を冒険する画像ギャラリー。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Serif+JP:wght@500;600;700;800;900&family=Zen+Old+Mincho:wght@500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f6f7fa;font-family:system-ui,"Noto Sans JP",sans-serif}header{position:sticky;top:0;z-index:3;background:#10131be8;backdrop-filter:blur(12px);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff20}h1{font-size:clamp(18px,3vw,28px);margin:0}header small{display:block;color:#aeb7ca;font-size:12px;margin-top:3px}a{color:inherit}header a{font-size:14px;text-decoration:none;border:1px solid #ffffff50;padding:9px 14px;border-radius:30px}.intro{padding:28px 5% 12px;color:#c4ccdb}.gallery{padding:12px 3% 60px;columns:4 220px;column-gap:12px}.item{break-inside:avoid;margin:0 0 12px;border-radius:14px;overflow:hidden;background:#202638;cursor:zoom-in}.item img{display:block;width:100%;height:auto}.empty{text-align:center;max-width:560px;margin:12vh auto;padding:35px 25px;border:1px dashed #66728b;border-radius:18px;color:#d0d7e4;line-height:1.9}.empty strong{color:white}.lightbox{position:fixed;inset:0;z-index:9;background:#000e;display:none;align-items:center;justify-content:center;padding:45px 15px 15px;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.close{position:absolute;top:10px;right:15px;background:#fff;color:#111;border:0;border-radius:50%;font-size:23px;width:36px;height:36px;cursor:pointer}@media(max-width:520px){.gallery{columns:2 130px;column-gap:8px;padding:8px}.item{margin-bottom:8px;border-radius:9px}header{padding:12px}}
.hero{position:relative;text-align:center;padding:62px 18px 56px;background:radial-gradient(ellipse at 50% 0%,#34445f,#151d30 45%,#0b0e17);border-bottom:1px solid #c9a76b55}.hero:before{content:"";position:absolute;inset:12px;border:1px solid #d9b87835;pointer-events:none}.eyebrow{color:#dfbf81;letter-spacing:.3em;font-size:12px;font-weight:800}.hero h1{font-family:Georgia,"Noto Serif JP",serif;font-size:clamp(30px,6vw,64px);margin:18px 0 6px;letter-spacing:.08em;text-shadow:0 5px 24px #000b}.hero .subtitle{color:#e6c787;letter-spacing:.15em;font-size:clamp(13px,2vw,20px)}.ornament{width:75px;height:2px;background:linear-gradient(90deg,transparent,#e4bd72,transparent);margin:30px auto 24px}.hero .jp{font-size:clamp(18px,3vw,28px);font-weight:800;line-height:1.8;color:#f5f1e9}.hero .jp em{color:#f2ca83;font-style:normal}.hero .en{font-size:clamp(13px,2vw,19px);line-height:1.7;color:#c9d0df;margin-top:18px}.hero .en strong{color:#e9c787}.section-title{text-align:center;color:#d7b87a;letter-spacing:.25em;font-size:12px;margin:30px 0 4px}.section-title:after{content:"";display:block;width:40px;height:1px;background:#bda06e;margin:12px auto 0}header h1{font-size:13px;letter-spacing:.16em;color:#dfbf81}header small{display:none}@media(max-width:520px){.hero{padding:45px 12px}.hero:before{inset:7px}}/* Cinematic title typography */.hero h1{font-family:"Zen Old Mincho","Noto Serif JP",serif;font-weight:900;letter-spacing:.13em;line-height:1.45;text-shadow:0 2px 2px #000,0 8px 26px #000b,0 0 38px #b9934940}.hero .jp{font-family:"Zen Old Mincho","Noto Serif JP",serif;font-weight:800;letter-spacing:.075em;line-height:1.9}.hero .jp em{font-weight:900}.hero .subtitle{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.19em;text-shadow:0 2px 14px #0008}.hero .en{font-family:"Cinzel",Georgia,serif;font-weight:500;letter-spacing:.055em;line-height:1.95}.hero .en strong{font-weight:700}.eyebrow,.section-title,header h1{font-family:"Cinzel",Georgia,serif;font-weight:700}.eyebrow{letter-spacing:.33em}.section-title{letter-spacing:.21em}@media(max-width:520px){.hero h1{letter-spacing:.055em}.hero .jp{letter-spacing:.025em}.hero .subtitle{letter-spacing:.08em}.hero .en{letter-spacing:0;font-size:12px}}</style></head><body><header><div><h1>🐼 PANDA UNIVERSE</h1></div><a href="/">← トップページ</a></header><section class="hero"><div class="eyebrow">ENTER THE GAME</div><h1>パンダのゲーム世界</h1><div class="subtitle">PANDA'S GAMING WORLD</div><div class="ornament"></div><p class="jp">無数の世界、無限の冒険。<br><em>主人公は、パンダ。</em></p><p class="en">Countless Worlds. Endless Adventures.<br><strong>One Unlikely Hero. A Panda.</strong></p></section><div class="section-title">THE ADVENTURE GALLERY</div><main id="gallery" class="gallery" aria-label="画像ギャラリー"></main><div id="lightbox" class="lightbox" role="dialog" aria-label="画像拡大表示" aria-modal="true"><button id="close" class="close" aria-label="閉じる">×</button><img id="large" alt=""></div><script>
const gallery=document.getElementById('gallery'),lightbox=document.getElementById('lightbox'),large=document.getElementById('large');
fetch('./gallery.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(items=>{if(!Array.isArray(items)||!items.length){gallery.innerHTML='<div class="empty"><strong>画像ギャラリー、準備中！</strong><br>パンダのゲーム冒険を、ここに少しずつ増やしていきます。🐼🎮</div>';return}for(const entry of items){if(!entry||typeof entry.file!=='string'||!/^images\/[\w.\-/]+\.(?:webp|jpe?g|png)$/i.test(entry.file)||entry.file.includes('..'))continue;const figure=document.createElement('figure');figure.className='item';const img=document.createElement('img');img.src=entry.file;img.alt=entry.title||'パンダのゲーム世界の画像';img.loading='lazy';img.decoding='async';figure.append(img);figure.addEventListener('click',()=>{large.src=img.src;large.alt=img.alt;lightbox.classList.add('open')});gallery.append(figure)}}).catch(()=>{gallery.innerHTML='<div class="empty">ギャラリーの読み込みに失敗しました。</div>'});function close(){lightbox.classList.remove('open');large.removeAttribute('src')}lightbox.addEventListener('click',e=>{if(e.target===lightbox)close()});document.getElementById('close').addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
