const openers=new Map();let previousFocus=null;const gallery=document.getElementById('gallery'),lightbox=document.getElementById('lightbox'),large=document.getElementById('large');
let activeSpeech,activeStatus,activeAudio;function stopSpeech(){window.PandaAudio?.stop();if(activeAudio){activeAudio.pause();activeAudio=null;}if('speechSynthesis' in window)window.speechSynthesis.cancel();if(activeStatus)activeStatus.textContent='';activeSpeech=null}function audioControls(entry,showNotes=true){const box=document.createElement('div');box.className='audio-controls';const status=document.createElement('span');status.setAttribute('role','status');const trial=/^images\/2026-1122-0\.[^.]+$/i.test(entry.file);const supported=trial||('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window);function speak(text,rate){if(!text)return;stopSpeech();if(window.PandaAudio?.play(text,rate,status)){activeStatus=status;return;}if(trial){const key=text===entry.captionEn?'sentence':text.toLowerCase().trim();if(['sentence','legendary','enter','ninja','realm'].includes(key)){stopSpeech();const a=new Audio('audio/2026-1122-0/'+key+'.wav');activeAudio=a;activeStatus=status;a.playbackRate=rate;a.onplaying=()=>{if(activeAudio===a)status.textContent='再生中…'};a.onended=()=>{if(activeAudio===a)status.textContent=''};const fail=()=>{if(activeAudio===a)status.textContent='音声ファイルを再生できませんでした。'};a.onerror=fail;a.play().catch(fail);return;}}if(!('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window)){status.textContent='この音声は利用できません。';return;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};speechSynthesis.speak(u)}function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(entry.captionEn,1));button(box,'ゆっくり',()=>speak(entry.captionEn,.75));button(box,'停止',stopSpeech);const notes=Array.isArray(entry.study)?entry.study:[];if(notes.length){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=showNotes?'ENGLISH TIP':'英単語・熟語の音声';details.append(summary);const group=document.createElement('div');group.className='audio-terms';for(const note of notes){const term=note.match(/^([A-Za-z][A-Za-z’' -]*?)(?:\s*～)?\s*(?:\/[^/]+\/\s*)?[:：]/)?.[1]?.trim();const item=document.createElement('div');item.className='tip-entry';if(showNotes){const p=document.createElement('p');p.textContent=note;item.append(p)}if(term)button(item,'🔊 '+term,()=>speak(term,1));if(item.childNodes.length)group.append(item)}details.append(group);box.append(details)}box.append(status);box.addEventListener('click',e=>e.stopPropagation());box.addEventListener('keydown',e=>e.stopPropagation());return box}
fetch('./gallery.json?v=20261122-2-'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(items=>{if(!Array.isArray(items)||!items.length){gallery.innerHTML='<div class="empty"><strong>画像ギャラリー、準備中！</strong><br>パンダのゲーム冒険を、ここに少しずつ増やしていきます。🐼🎮</div>';return}for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}for(const entry of items){if(!entry||typeof entry.file!=='string'||!/^images\/[\w.\-/]+\.(?:webp|jpe?g|png)$/i.test(entry.file)||entry.file.includes('..'))continue;const figure=document.createElement('figure');figure.className='item';const img=document.createElement('img');{const key=decodeURI(new URL(entry.file,location.href).pathname).replace(/^\//,'');const variants=window.PandaPreviews?.[key];if(variants?.length){img.sizes='(max-width: 560px) 100vw, 360px';img.srcset=variants.map(v=>v.path+' '+v.width+'w').join(', ');}}img.src=entry.file;img.alt=entry.alt||entry.title||('パンダのゲーム世界：'+(entry.captionJa||'冒険のイラスト'));img.loading='lazy';img.decoding='async';figure.append(img);if(entry.captionJa||entry.captionEn){const caption=document.createElement('figcaption');if(entry.captionJa){const ja=document.createElement('span');ja.className='caption-ja';ja.textContent=entry.captionJa;caption.append(ja)}if(entry.captionEn){const en=document.createElement('span');en.className='caption-en';en.textContent=entry.captionEn;caption.append(en)}figure.append(caption)}if(entry.captionEn)figure.append(audioControls(entry));figure.tabIndex=0;figure.setAttribute('role','button');figure.setAttribute('aria-label',(entry.captionJa||img.alt)+' 詳細を表示');const id=entry.file.slice(7).replace(/\.[^.]+$/,'');const open=(updateUrl=true)=>{stopSpeech();if(updateUrl){const url=new URL(location.href);url.searchParams.set('id',id);if(url.href!==location.href)history.pushState({galleryDetail:true},'',url)}document.getElementById('share-status').textContent='';previousFocus=figure;large.src=img.src;large.alt=img.alt;document.getElementById('detail-ja').textContent=entry.captionJa||'';document.getElementById('detail-en').textContent=entry.captionEn||'';const audio=document.getElementById('detail-audio');audio.replaceChildren();if(entry.captionEn)audio.append(audioControls(entry,false));const list=document.getElementById('study-list');list.replaceChildren();for(const note of (Array.isArray(entry.study)?entry.study:[])){const li=document.createElement('li');li.textContent=note;list.append(li)}document.getElementById('study').hidden=!list.children.length;lightbox.classList.add('open');document.body.classList.add('dialog-open');lightbox.scrollTop=0;document.getElementById('close').focus()};openers.set(id,open);figure.addEventListener('click',()=>open());figure.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});const permalink=document.createElement('a');permalink.href='works/'+encodeURIComponent(id)+'/';permalink.textContent='作品の個別ページ';permalink.style.cssText='display:block;text-align:center;font-size:12px;padding:6px;color:#e6c787';permalink.addEventListener('click',e=>e.stopPropagation());permalink.addEventListener('keydown',e=>e.stopPropagation());figure.append(permalink);gallery.append(figure)}syncFromUrl()}).catch(()=>{gallery.innerHTML='<div class="empty">ギャラリーの読み込みに失敗しました。</div>'});function hideDetail(){stopSpeech();if(!lightbox.classList.contains('open'))return;lightbox.classList.remove('open');document.body.classList.remove('dialog-open');large.removeAttribute('src');previousFocus?.focus()}function syncFromUrl(){const id=new URL(location.href).searchParams.get('id');const open=openers.get(id);if(open)open(false);else hideDetail()}function close(){if(!lightbox.classList.contains('open'))return;const url=new URL(location.href);url.searchParams.delete('id');if(history.state?.galleryDetail){history.back()}else{history.replaceState(null,'',url);hideDetail()}}window.addEventListener('popstate',syncFromUrl);document.getElementById('share').addEventListener('click',async()=>{const status=document.getElementById('share-status');try{await navigator.clipboard.writeText(location.href);status.textContent='URLをコピーしました'}catch{window.prompt('作品のURLをコピーしてください',location.href)}});lightbox.addEventListener('click',e=>{if(e.target===lightbox)close()});document.getElementById('close').addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&lightbox.classList.contains('open')){e.preventDefault();const buttons=[...lightbox.querySelectorAll('button:not(:disabled),summary')].filter(el=>el.getClientRects().length);const i=buttons.indexOf(document.activeElement);buttons[(i+(e.shiftKey?-1:1)+buttons.length)%buttons.length].focus()}});
