<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダのゲーム世界 | Panda's Gaming World</title><meta name="description" content="パンダがゲームの世界を冒険する画像ギャラリー。"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f6f7fa;font-family:system-ui,"Noto Sans JP",sans-serif}header{position:sticky;top:0;z-index:3;background:#10131be8;backdrop-filter:blur(12px);padding:14px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff20}h1{font-size:clamp(18px,3vw,28px);margin:0}header small{display:block;color:#aeb7ca;font-size:12px;margin-top:3px}a{color:inherit}header a{font-size:14px;text-decoration:none;border:1px solid #ffffff50;padding:9px 14px;border-radius:30px}.intro{padding:28px 5% 12px;color:#c4ccdb}.gallery{padding:12px 3% 60px;columns:4 220px;column-gap:12px}.item{break-inside:avoid;margin:0 0 12px;border-radius:14px;overflow:hidden;background:#202638;cursor:zoom-in}.item img{display:block;width:100%;height:auto}.empty{text-align:center;max-width:560px;margin:12vh auto;padding:35px 25px;border:1px dashed #66728b;border-radius:18px;color:#d0d7e4;line-height:1.9}.empty strong{color:white}.lightbox{position:fixed;inset:0;z-index:9;background:#000e;display:none;align-items:center;justify-content:center;padding:45px 15px 15px;cursor:zoom-out}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.close{position:absolute;top:10px;right:15px;background:#fff;color:#111;border:0;border-radius:50%;font-size:23px;width:36px;height:36px;cursor:pointer}@media(max-width:520px){.gallery{columns:2 130px;column-gap:8px;padding:8px}.item{margin-bottom:8px;border-radius:9px}header{padding:12px}}
</style></head><body><header><div><h1>🐼 パンダのゲーム世界</h1><small>Panda's Gaming World</small></div><a href="/">← トップページ</a></header><p class="intro">パンが飛び込む、ゲームの世界。静止画で楽しむパンダの冒険。</p><main id="gallery" class="gallery" aria-label="画像ギャラリー"></main><div id="lightbox" class="lightbox" role="dialog" aria-label="画像拡大表示" aria-modal="true"><button id="close" class="close" aria-label="閉じる">×</button><img id="large" alt=""></div><script>
const gallery=document.getElementById('gallery'),lightbox=document.getElementById('lightbox'),large=document.getElementById('large');
fetch('./gallery.json').then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(items=>{if(!Array.isArray(items)||!items.length){gallery.innerHTML='<div class="empty"><strong>画像ギャラリー、準備中！</strong><br>パンダのゲーム冒険を、ここに少しずつ増やしていきます。🐼🎮</div>';return}for(const entry of items){if(!entry||typeof entry.file!=='string'||!/^images\/[\w.\-/]+\.gif$/i.test(entry.file)||entry.file.includes('..'))continue;const figure=document.createElement('figure');figure.className='item';const img=document.createElement('img');img.src=entry.file;img.alt=entry.title||'パンダのゲーム世界の画像';img.loading='lazy';img.decoding='async';figure.append(img);figure.addEventListener('click',()=>{large.src=img.src;large.alt=img.alt;lightbox.classList.add('open')});gallery.append(figure)}}).catch(()=>{gallery.innerHTML='<div class="empty">ギャラリーの読み込みに失敗しました。</div>'});function close(){lightbox.classList.remove('open');large.removeAttribute('src')}lightbox.addEventListener('click',e=>{if(e.target===lightbox)close()});document.getElementById('close').addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
