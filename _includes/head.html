{% assign seo_title = page.title | default: 'パンダと楽しく英語学習' %}
{% assign seo_desc = page.description | default: 'パンダのイラストと日英対訳で楽しむ英語学習。名言、川柳、日記、英単語を紹介。' %}
{% assign seo_url = page.url | replace: 'index.html', '' | prepend: 'https://papan2222.github.io' %}
<title>{{ seo_title | escape }}</title>
<meta name="description" content="{{ seo_desc | escape }}">
<link rel="canonical" href="{{ seo_url | escape }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="papan2222">
<meta property="og:title" content="{{ seo_title | escape }}">
<meta property="og:description" content="{{ seo_desc | escape }}">
<meta property="og:url" content="{{ seo_url | escape }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/animal-site-icon.jpg" type="image/jpeg">
