<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダの英語名言</title><style>body{background:#0b0f14;color:#e5e7eb;font-family:system-ui,sans-serif;margin:0}main{max-width:700px;margin:auto;padding:24px}a{color:#d1d5db}article{margin:32px 0;padding:24px 0;border-block:1px solid #374151}h1{font-size:18px}#en{font-size:clamp(22px,5vw,30px);line-height:1.6}#jp{color:#d1d5db;line-height:1.8}#author{text-align:right}small{color:#a1a1aa}</style></head><body><main><h1>パンダの英語名言</h1><a href="/quotes/">名言一覧へ戻る</a><article><div id="en" lang="en">読み込み中…</div><p id="jp"></p><p id="author"></p><p id="profile" style="font-size:14px;color:#a1a1aa;line-height:1.7"></p></article><small>原典・作者への帰属は未確認のものを含みます。日本語訳はAI支援を含みます。</small></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/quotes.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{const q=a.find(q=>q.id===id);if(!q)throw Error();for(const k of ['en','jp','author'])document.getElementById(k).textContent=q[k];document.title=q.en+' | パンダの英語名言';fetch('/quotes/authors.json').then(r=>r.json()).then(a=>{const p=a[q.author];if(p){document.getElementById('author').textContent=p.ja+' ／ '+q.author;document.getElementById('profile').textContent=p.years+'　'+p.bio}}).catch(()=>{})}).catch(()=>{document.getElementById('en').textContent='名言が見つかりません。'});</script></body></html>
