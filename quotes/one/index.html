<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダの英語名言</title><style>:root{color-scheme:dark;--ink:#f4eedf;--muted:#b9bdc5;--gold:#d9ba7c;--line:#77674c}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 15% 0%,#303d50 0%,transparent 55%),radial-gradient(ellipse at 100% 90%,#34312e 0%,transparent 48%),#182330}main{max-width:760px;margin:auto;padding:28px 22px 42px}header{border-bottom:1px solid #ffffff20;padding-bottom:18px}h1{font-family:Georgia,"Yu Mincho",serif;font-size:20px;font-weight:500;letter-spacing:.08em;margin:0 0 12px}a{color:var(--gold);text-underline-offset:4px}header a{font-size:13px}article{position:relative;margin:28px 0 18px;padding:clamp(20px,5vw,42px);border:1px solid #a58b574d;border-radius:8px;background:linear-gradient(145deg,#263343,#202b39);box-shadow:0 16px 48px #080d1938}article:before{content:"“";display:block;color:var(--gold);font:64px/.65 Georgia,serif;margin:0 0 18px}#en{font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,5vw,33px);line-height:1.5;overflow-wrap:anywhere}#jp{color:#e1dfd8;line-height:1.9;margin-top:24px}#author{text-align:right;color:var(--gold);font-family:Georgia,"Yu Mincho",serif;line-height:1.6}#tips{margin-top:28px;padding:18px 20px;background:#121c2a66;border-left:2px solid var(--gold);border-radius:0 5px 5px 0}#tips h2{margin:0 0 10px;color:var(--gold)}#tip-list{margin:0;color:#e2e5eb}#profile{border-top:1px solid #ffffff20;padding-top:16px;margin-bottom:0}nav{display:flex;justify-content:center;margin:20px 0 24px}button{font:inherit;font-size:15px;letter-spacing:.04em;color:#192330;background:#d9ba7c;border:1px solid #e8ce99;border-radius:6px;padding:13px 25px;cursor:pointer;min-height:48px}button:hover{background:#ecd09a}button:disabled{opacity:.45;cursor:default}a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:4px}small{color:var(--muted);font-size:12px;line-height:1.7;display:block}@media(max-width:480px){main{padding:20px 12px 32px}article{margin-top:20px;padding:22px 18px}#tips{padding:14px 12px}nav button{width:100%}}</style></head><body><main><header><h1>パンダの英語名言</h1><a href="/quotes/">名言一覧へ戻る</a></header><article><div id="en" lang="en">読み込み中…</div><p id="jp"></p><p id="author"></p><section id="tips" hidden><h2 style="font-size:13px;letter-spacing:.06em">ENGLISH TIP</h2><ul id="tip-list" style="padding-left:20px;line-height:1.8;font-size:15px"></ul></section><p id="profile" style="font-size:14px;color:#b9bdc5;line-height:1.7"></p></article><nav aria-label="名言の移動"><button id="random-next" type="button" disabled>次の名言へ（ランダム） →</button></nav><small>原典・作者への帰属は未確認のものを含みます。日本語訳はAI支援を含みます。</small></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/quotes.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{const q=a.find(q=>q.id===id);if(!q)throw Error();const next=document.getElementById('random-next');const others=a.filter(v=>v.id&&v.id!==q.id);if(others.length){next.disabled=false;next.addEventListener('click',()=>{const target=others[Math.floor(Math.random()*others.length)];location.href='?id='+encodeURIComponent(target.id)})}for(const k of ['en','jp','author'])document.getElementById(k).textContent=q[k];if(Array.isArray(q.tips)&&q.tips.length){document.getElementById('tips').hidden=false;for(const t of q.tips){const li=document.createElement('li');li.textContent=t;document.getElementById('tip-list').append(li)}}document.title=q.en+' | パンダの英語名言';fetch('/quotes/authors.json').then(r=>r.json()).then(a=>{const p=a[q.author];if(p){document.getElementById('author').textContent=p.ja+' ／ '+q.author;document.getElementById('profile').textContent=p.years+'　'+p.bio}}).catch(()=>{})}).catch(()=>{document.getElementById('en').textContent='名言が見つかりません。'});</script></body></html>
