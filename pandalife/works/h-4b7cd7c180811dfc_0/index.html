 li+li:before{content:"›";margin-right:5px;opacity:.7}.seo-breadcrumb a{color:inherit;text-decoration:underline}.seo-breadcrumb li[aria-current]{opacity:.85}</style><!-- seo-structured:end --></head><body><!-- seo-breadcrumb:start --><nav class="seo-breadcrumb" aria-label="パンくずリスト"><ol><li><a href="https://papan2222.github.io/">ホーム</a></li><li><a href="https://papan2222.github.io/pandalife/">パンダの詩と小さな物語</a></li><li aria-current="page">Owl</li></ol></nav><!-- seo-breadcrumb:end --><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>Owl</h1><img src="/pandalife/images/61faefd2cb56008c1fb05abd0d05a51d.webp" alt="Owl" loading="eager" data-preview-auto="1" srcset="/assets/previews/71bb5c26e88315192180f2c3-640.webp 640w, /assets/previews/71bb5c26e88315192180f2c3-1280.webp 1280w" sizes="(max-width: 800px) 100vw, 800px" decoding="async"><p lang="ja">👦　パンダ、起きてるの？</p><p lang="ja">🐼　うん。木にとまったフクロウが話しかけてくるんだ。</p><p lang="en">👦　Panda, are you awake?</p><p lang="en">🐼　Yeah. The owl in the tree keeps talking to me.</p><style>.audio-trial{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;align-items:center}.audio-trial button{font:inherit;font-size:14px;padding:8px;border:1px solid #c9bca9;border-radius:8px;background:white;color:inherit;cursor:pointer}.audio-trial span{width:100%;font-size:13px}</style><div id="work-audio"></div><script src="/audio/player.js"></script><script>let activeSpeech,activeStatus;function stopSpeech(){window.PandaAudio?.stop();if('speechSynthesis' in window)window.speechSynthesis.cancel();if(activeStatus)activeStatus.textContent='';activeSpeech=null}function audioControls(w){const box=document.createElement('div');box.className='audio-trial';const status=document.createElement('span');status.setAttribute('role','status');const supported='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;function speak(text,rate){if(!text)return;stopSpeech();if(window.PandaAudio?.play(text,rate,status)){activeStatus=status;return;}if(!supported){status.textContent='音声を利用できません。';return;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-4b7cd7c180811dfc_0", "text": ["\ud83d\udc66\u3000\u30d1\u30f3\u30c0\u3001\u8d77\u304d\u3066\u308b\u306e\uff1f", "\ud83d\udc3c\u3000\u3046\u3093\u3002\u6728\u306b\u3068\u307e\u3063\u305f\u30d5\u30af\u30ed\u30a6\u304c\u8a71\u3057\u304b\u3051\u3066\u304f\u308b\u3093\u3060\u3002", "\ud83d\udc66\u3000Panda, are you awake?", "\ud83d\udc3c\u3000Yeah. The owl in the tree keeps talking to me."], "study": ["awake /\u0259\u02c8we\u026ak/\uff1a\u76ee\u304c\u899a\u3081\u3066\u3044\u308b\u3002", "keep doing\uff1a\uff5e\u3057\u7d9a\u3051\u308b\u3002", "\u4f8b\uff1aHe keeps asking questions.\uff08\u5f7c\u306f\u8cea\u554f\u3057\u7d9a\u3051\u308b\u3002\uff09"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>awake /əˈweɪk/：目が覚めている。</li><li>keep doing：～し続ける。</li><li>例：He keeps asking questions.（彼は質問し続ける。）</li></ul><div style="text-align:center;margin:26px 0 12px"><button id="random-work" type="button" style="font:inherit;padding:12px 28px;border:1px solid #c9bca9;border-radius:8px;background:#e9dfce;color:#39342e;cursor:pointer">🔀 次の作品へ <small>Random Next</small></button><p id="random-status" role="status"></p></div><script>document.getElementById('random-work').addEventListener('click',async function(){this.disabled=true;try{const r=await fetch('/pandalife/works.json');if(!r.ok)throw Error();const rows=await r.json();const current=location.pathname.split('/').filter(Boolean).pop();const pool=rows.filter(w=>w.id!==current&&w.text?.some(Boolean)&&/^[A-Za-z0-9_-]+$/.test(w.id));if(!pool.length)throw Error();location.href='/pandalife/works/'+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)].id)+'/';}catch(e){document.getElementById('random-status').textContent='次の作品を読み込めませんでした。';this.disabled=false;}});</script><p><a href="/pandalife/?id=h-4b7cd7c180811dfc_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
