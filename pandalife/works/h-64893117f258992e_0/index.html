||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-64893117f258992e_0", "text": ["\u30d2\u30e3\u30c3\u30cf\u30fc\uff01\u305f\u306e\u3057\u3044\u306d\u3047\u3001\u3053\u308c\ud83c\udfcd\ufe0f", "Yay! It's fun!"], "study": ["yay /je\u026a/\uff1a\u3084\u3063\u305f\u30fc\uff01\u3068\u3044\u3046\u559c\u3073\u306e\u611f\u5606\u8a5e\u3002", "fun /f\u028cn/\uff1a\u697d\u3057\u3055\u3001\u697d\u3057\u3044\u3053\u3068\u3002", "It's fun!\uff1a\u697d\u3057\u3044\u306d\uff01 funny \u306f\u4e3b\u306b\u300c\u304a\u304b\u3057\u3044\u3001\u7b11\u3048\u308b\u300d\u3068\u3044\u3046\u610f\u5473\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>yay /jeɪ/：やったー！という喜びの感嘆詞。</li><li>fun /fʌn/：楽しさ、楽しいこと。</li><li>It&#x27;s fun!：楽しいね！ funny は主に「おかしい、笑える」という意味。</li></ul><p><a href="/pandalife/?id=h-64893117f258992e_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
