<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダは思う｜パンダの英語作品</title><meta name="description" content="🐼 人間って不思議だね。わざわざ服を着て、また脱ぐんだから。 🐼 Humans are strange. You put clothes on just to take them off again."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-7f518e828517ff7a_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>パンダは思う</h1><img src="/pandalife/images/7c2bfac21d775f475615b2c9fcff9d51.webp" alt="パンダは思う" loading="eager" data-preview-auto="1" srcset="/assets/previews/eb37a5a91219db6430c0e125-508.webp 508w" sizes="(max-width: 800px) 100vw, 800px" decoding="async"><p lang="ja">🐼 人間って不思議だね。わざわざ服を着て、また脱ぐんだから。</p><p lang="en">🐼 Humans are strange. You put clothes on just to take them off again.</p><h2>英語学習ポイント</h2><ul><li>put on /pʊt ɑn/：服などを身につける。take off /teɪk ɔf/：脱ぐ。</li><li>just to ～：ここでは「わざわざ～するだけなのに」という皮肉。</li><li>例：I took off my coat.（コートを脱いだ。）</li></ul><p><a href="/pandalife/?id=h-7f518e828517ff7a_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
