<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>クローゼット｜パンダの英語作品</title><meta name="description" content="わたしは置かれた。永久の闇のうちに。しかして、人間は「整理」と呼んだ。 I was placed into eternal darkness—man called it “tidying up.”"><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-558cf459a77d8661_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>クローゼット</h1><img src="/pandalife/images/fb09783ff1d9844ff2f7324196454b10.webp" alt="クローゼット" loading="lazy"><p lang="ja">わたしは置かれた。永久の闇のうちに。しかして、人間は「整理」と呼んだ。</p><p lang="en">I was placed into eternal darkness—man called it “tidying up.”</p><h2>英語学習ポイント</h2><ul><li>eternal /ɪˈtɜrnəl/：永遠の。</li><li>darkness /ˈdɑrknəs/：暗闇。</li><li>tidy up /ˈtaɪdi ʌp/：片づける。</li></ul><p><a href="/pandalife/?id=h-558cf459a77d8661_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
