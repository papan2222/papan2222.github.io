;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").a
