<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>感情｜パンダの英語作品</title><meta name="description" content="🦁 飲みすぎるなよ。 🐼 大丈夫、感情の方が先に溢れますから。 🦁 Don’t drink too much. 🐼 No worries—my emotions spill first."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-178de3cdcd9684c4_10/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>感情</h1><img src="/pandalife/images/252d855ec6c86cfa8ad4e4d1c27e34de.webp" alt="感情" loading="lazy"><p lang="ja">🦁 飲みすぎるなよ。</p><p lang="ja">🐼 大丈夫、感情の方が先に溢れますから。</p><p lang="en">🦁 Don’t drink too much.</p><p lang="en">🐼 No worries—my emotions spill first.</p><h2>英語学習ポイント</h2><ul><li>emotion /ɪˈmoʊʃən/：感情。</li><li>spill /spɪl/：こぼれる。ここでは感情があふれる比喩。</li><li>No worries.：心配いらないよ。</li></ul><p><a href="/pandalife/?id=h-178de3cdcd9684c4_10">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
