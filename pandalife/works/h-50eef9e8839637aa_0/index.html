<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宇宙｜パンダの英語作品</title><meta name="description" content="星に名を与えるうさぎ ただ夜空に祈るパンダ ふたりの想いが　ふたりの宇宙を紡いでいく The rabbit names the stars, the panda trusts the sky, weaving a night where curiosity is its own answer."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-50eef9e8839637aa_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>宇宙</h1><img src="/pandalife/images/fa3219f9970d60bc6a1a959c94c12833.webp" alt="宇宙" loading="lazy"><p lang="ja">星に名を与えるうさぎ</p><p lang="ja">ただ夜空に祈るパンダ</p><p lang="ja">ふたりの想いが　ふたりの宇宙を紡いでいく</p><p lang="en">The rabbit names the stars,</p><p lang="en">the panda trusts the sky,</p><p lang="en">weaving a night where curiosity is its own answer.</p><h2>英語学習ポイント</h2><ul><li>curiosity /ˌkjʊriˈɑsəti/：好奇心。</li><li>weave /wiv/：織る、紡ぐ。</li><li>its own answer：それ自体が答え。own は「自身の」を強調する。</li></ul><p><a href="/pandalife/?id=h-50eef9e8839637aa_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
