<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>懐石｜パンダの英語作品</title><meta name="description" content="🐼この味、夏ですね…胃が言ってます。 🐧お前の五感、ほぼ腹だな。 🐼Tastes like summer… or so my stomach says. 🐧All five of your senses live in your gut."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-582c600b70353f1e_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>懐石</h1><img src="/pandalife/images/5436567fcb06b6ec9c4f9fb084f9548d.webp" alt="懐石" loading="lazy"><p lang="ja">🐼この味、夏ですね…胃が言ってます。</p><p lang="ja">🐧お前の五感、ほぼ腹だな。</p><p lang="en">🐼Tastes like summer… or so my stomach says.</p><p lang="en">🐧All five of your senses live in your gut.</p><h2>英語学習ポイント</h2><ul><li>stomach /ˈstʌmək/：胃、お腹。</li><li>gut /ɡʌt/：腸、腹。口語では直感も表す。</li><li>or so ... says：少なくとも～はそう言っている。</li></ul><p><a href="/pandalife/?id=h-582c600b70353f1e_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
