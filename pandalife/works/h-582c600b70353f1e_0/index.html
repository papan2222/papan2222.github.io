-breadcrumb li+li:before{content:"›";margin-right:5px;opacity:.7}.seo-breadcrumb a{color:inherit;text-decoration:underline}.seo-breadcrumb li[aria-current]{opacity:.85}</style><!-- seo-structured:end --></head><body><!-- seo-breadcrumb:start --><nav class="seo-breadcrumb" aria-label="パンくずリスト"><ol><li><a href="https://papan2222.github.io/">ホーム</a></li><li><a href="https://papan2222.github.io/pandalife/">パンダの詩と小さな物語</a></li><li aria-current="page">懐石</li></ol></nav><!-- seo-breadcrumb:end --><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>懐石</h1><img src="/pandalife/images/5436567fcb06b6ec9c4f9fb084f9548d.webp" alt="懐石" loading="eager" data-preview-auto="1" srcset="/assets/previews/1e2fad8ccde2786eecf2da5a-640.webp 640w, /assets/previews/1e2fad8ccde2786eecf2da5a-1280.webp 1280w" sizes="(max-width: 800px) 100vw, 800px" decoding="async"><p lang="ja">🐼この味、夏ですね…胃が言ってます。</p><p lang="ja">🐧お前の五感、ほぼ腹だな。</p><p lang="en">🐼Tastes like summer… or so my stomach says.</p><p lang="en">🐧All five of your senses live in your gut.</p><style>.audio-trial{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;align-items:center}.audio-trial button{font:inherit;font-size:14px;padding:8px;border:1px solid #c9bca9;border-radius:8px;background:white;color:inherit;cursor:pointer}.audio-trial span{width:100%;font-size:13px}</style><div id="work-audio"></div><script src="/audio/player.js"></script><script>let activeSpeech,activeStatus;function stopSpeech(){window.PandaAudio?.stop();if('speechSynthesis' in window)window.speechSynthesis.cancel();if(activeStatus)activeStatus.textContent='';activeSpeech=null}function audioControls(w){const box=document.createElement('div');box.className='audio-trial';const status=document.createElement('span');status.setAttribute('role','status');const supported='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;function speak(text,rate){if(!text)return;stopSpeech();if(window.PandaAudio?.play(text,rate,status)){activeStatus=status;return;}if(!supported){status.textContent='音声を利用できません。';return;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-582c600b70353f1e_0", "text": ["\ud83d\udc3c\u3053\u306e\u5473\u3001\u590f\u3067\u3059\u306d\u2026\u80c3\u304c\u8a00\u3063\u3066\u307e\u3059\u3002", "\ud83d\udc27\u304a\u524d\u306e\u4e94\u611f\u3001\u307b\u307c\u8179\u3060\u306a\u3002", "\ud83d\udc3cTastes like summer\u2026 or so my stomach says.", "\ud83d\udc27All five of your senses live in your gut."], "study": ["stomach /\u02c8st\u028cm\u0259k/\uff1a\u80c3\u3001\u304a\u8179\u3002", "gut /\u0261\u028ct/\uff1a\u8178\u3001\u8179\u3002\u53e3\u8a9e\u3067\u306f\u76f4\u611f\u3082\u8868\u3059\u3002", "or so ... says\uff1a\u5c11\u306a\u304f\u3068\u3082\uff5e\u306f\u305d\u3046\u8a00\u3063\u3066\u3044\u308b\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>stomach /ˈstʌmək/：胃、お腹。</li><li>gut /ɡʌt/：腸、腹。口語では直感も表す。</li><li>or so ... says：少なくとも～はそう言っている。</li></ul><div style="text-align:center;margin:26px 0 12px"><button id="random-work" type="button" style="font:inherit;padding:12px 28px;border:1px solid #c9bca9;border-radius:8px;background:#e9dfce;color:#39342e;cursor:pointer">🔀 次の作品へ <small>Random Next</small></button><p id="random-status" role="status"></p></div><script>document.getElementById('random-work').addEventListener('click',async function(){this.disabled=true;try{const r=await fetch('/pandalife/works.json');if(!r.ok)throw Error();const rows=await r.json();const current=location.pathname.split('/').filter(Boolean).pop();const pool=rows.filter(w=>w.id!==current&&w.text?.some(Boolean)&&/^[A-Za-z0-9_-]+$/.test(w.id));if(!pool.length)throw Error();location.href='/pandalife/works/'+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)].id)+'/';}catch(e){document.getElementById('random-status').textContent='次の作品を読み込めませんでした。';this.disabled=false;}});</script><p><a href="/pandalife/?id=h-582c600b70353f1e_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
