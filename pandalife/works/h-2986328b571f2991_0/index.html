<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うどん｜パンダの英語作品</title><meta name="description" content="ついたち は　饂飩が僕らに　やさしい日　丸亀製麺　ぬいまでしみる The first of the month— udon is extra kind to us. At Marugame, even plush souls feel the warmth."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-2986328b571f2991_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>うどん</h1><img src="/pandalife/images/1908306a55a9a67893564a05959fddc4.webp" alt="うどん" loading="lazy"><p lang="ja">ついたち は　饂飩が僕らに　やさしい日　丸亀製麺　ぬいまでしみる The first of the month—</p><p lang="en">udon is extra kind to us.</p><p lang="en">At Marugame,</p><p lang="en">even plush souls</p><p lang="en">feel the warmth.</p><h2>英語学習ポイント</h2><ul><li>extra /ˈɛkstrə/：特に、いつも以上に。</li><li>soul /soʊl/：魂。plush souls はぬいぐるみたちを指す詩的表現。</li><li>warmth /wɔrmθ/：温かさ。</li></ul><p><a href="/pandalife/?id=h-2986328b571f2991_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
