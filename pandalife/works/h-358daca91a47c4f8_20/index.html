<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピアノ｜パンダの英語作品</title><meta name="description" content="ピアノは壊れていても ぼくの心はまだ奏でている もう戻らない過去を Though the piano is silent, my heart still composes for the past that will not come back."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-358daca91a47c4f8_20/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>ピアノ</h1><img src="/pandalife/images/bb10c2c9272a39361b682db94413a27c.webp" alt="ピアノ" loading="lazy"><p lang="ja">ピアノは壊れていても</p><p lang="ja">ぼくの心はまだ奏でている</p><p lang="ja">もう戻らない過去を</p><p lang="en">Though the piano is silent,</p><p lang="en">my heart still composes</p><p lang="en">for the past that will not come back.</p><h2>英語学習ポイント</h2><ul><li>compose /kəmˈpoʊz/：作曲する、文章を作る。</li><li>silent /ˈsaɪlənt/：静かな、音のしない。</li><li>Though ～：～だけれども。</li></ul><p><a href="/pandalife/?id=h-358daca91a47c4f8_20">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
