<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>側にいるよ｜パンダの英語作品</title><meta name="description" content="ことばが いらないときは、ぬいぐるみが いちばん ちかくにいるとき。 When words are too much, a plush is closest of all."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-63f92a732ba7c5a5_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>側にいるよ</h1><img src="/pandalife/images/32e1e5bdb62ebbd853cfaa298bf7703c.webp" alt="側にいるよ" loading="eager" data-preview-auto="1" srcset="/assets/previews/285206e909e7d4aed2247245-640.webp 640w, /assets/previews/285206e909e7d4aed2247245-1280.webp 1280w" sizes="(max-width: 800px) 100vw, 800px" decoding="async"><p lang="ja">ことばが いらないときは、ぬいぐるみが いちばん ちかくにいるとき。</p><p lang="en">When words are too much,</p><p lang="en">a plush is closest of all.</p><h2>英語学習ポイント</h2><ul><li>closest /ˈkloʊsəst/：最も近い。close の最上級。</li><li>too much：多すぎる、負担が大きすぎる。</li><li>of all：すべての中で。</li></ul><p><a href="/pandalife/?id=h-63f92a732ba7c5a5_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
