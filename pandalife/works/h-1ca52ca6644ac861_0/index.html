<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bedhead｜パンダの英語作品</title><meta name="description" content="毛並みをそろえても、こころは少し寝ぐせのまま。 No matter how smooth my fur, my heart always keeps a little bedhead."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-1ca52ca6644ac861_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>bedhead</h1><img src="/pandalife/images/5b42a317b6337bd5830f5940840f8eb0.webp" alt="bedhead" loading="lazy"><p lang="ja">毛並みをそろえても、こころは少し寝ぐせのまま。</p><p lang="en">No matter how smooth my fur, my heart always keeps a little bedhead.</p><h2>英語学習ポイント</h2><ul><li>smooth /smuð/：滑らかな。fur /fɜr/：毛並み、毛皮。</li><li>bedhead /ˈbɛdhɛd/：寝ぐせのついた髪。ここでは心の乱れを寝ぐせにたとえている。</li><li>No matter how ～：どんなに～でも。</li></ul><p><a href="/pandalife/?id=h-1ca52ca6644ac861_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
