 itself from the room."], "study": ["reason /\u02c8riz\u0259n/\uff1a\u7406\u6027\u3001\u7406\u7531\u3002", "excuse oneself /\u026ak\u02c8skjuz w\u028cn\u02c8s\u025blf/\uff1a\u65ad\u3063\u3066\u305d\u306e\u5834\u3092\u96e2\u308c\u308b\u3002", "\u7406\u6027\u3092\u4eba\u9593\u306e\u3088\u3046\u306b\u63cf\u304f\u64ec\u4eba\u6cd5\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>reason /ˈrizən/：理性、理由。</li><li>excuse oneself /ɪkˈskjuz wʌnˈsɛlf/：断ってその場を離れる。</li><li>理性を人間のように描く擬人法。</li></ul><p><a href="/pandalife/?id=h-321341db98e95ef4_10">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
