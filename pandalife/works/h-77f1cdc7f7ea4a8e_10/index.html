<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存在｜パンダの英語作品</title><meta name="description" content="あの子の涙も笑いも、ぼくの中にあった。 じゃあ、その子がいないぼくは、なんなんだろう。 That child’s laughter and tears once lived in me. So what am I now, without them?"><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-77f1cdc7f7ea4a8e_10/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>存在</h1><img src="/pandalife/images/106e1457be679c84958788a5e0405f99.webp" alt="存在" loading="lazy"><p lang="ja">あの子の涙も笑いも、ぼくの中にあった。</p><p lang="ja">じゃあ、その子がいないぼくは、なんなんだろう。</p><p lang="en">That child’s laughter and tears once lived in me.</p><p lang="en">So what am I now, without them?</p><h2>英語学習ポイント</h2><ul><li>laughter /ˈlæftər/：笑い、笑い声。</li><li>tear /tɪr/：涙。tear（破る）/tɛr/ とは発音が異なる。</li><li>once /wʌns/：かつて。</li></ul><p><a href="/pandalife/?id=h-77f1cdc7f7ea4a8e_10">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
