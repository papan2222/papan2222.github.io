<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悩むパンダ｜パンダの英語作品</title><meta name="description" content="触れられぬ日は、存在そのものが問いかけを始める。 On untouched days, my very being begins to question itself."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-d78c9e6349b9c99_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>悩むパンダ</h1><img src="/pandalife/images/b2eb35af02765b26c8e8c9226b3341a6.webp" alt="悩むパンダ" loading="lazy"><p lang="ja">触れられぬ日は、存在そのものが問いかけを始める。</p><p lang="en">On untouched days, my very being begins to question itself.</p><h2>英語学習ポイント</h2><ul><li>untouched /ʌnˈtʌtʃt/：触れられていない。</li><li>being /ˈbiɪŋ/：存在。</li><li>question /ˈkwɛstʃən/：動詞では疑問を抱く、問い直す。</li></ul><p><a href="/pandalife/?id=h-d78c9e6349b9c99_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
