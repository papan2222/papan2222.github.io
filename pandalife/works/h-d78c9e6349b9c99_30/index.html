esisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-d78c9e6349b9c99_30", "text": ["\u3072\u3068\u308a\u304d\u308a\u3000\u97f3\u3060\u3051\u5f3e\u3051\u308b\u3000\u30dd\u30c3\u30d7\u30b3\u30fc\u30f3", "All alone I sit, \u00a0 only kernels burst with sound\u2014\u00a0 popcorn fills the void."], "study": ["kernel /\u02c8k\u025crn\u0259l/\uff1a\u7a40\u7269\u306e\u7c92\u3002", "burst /b\u025crst/\uff1a\u306f\u3058\u3051\u308b\u3001\u7834\u88c2\u3059\u308b\u3002", "void /v\u0254\u026ad/\uff1a\u7a7a\u865a\u3001\u7a7a\u767d\u3002fill the void \u306f\u5fc3\u306e\u7a7a\u767d\u3092\u57cb\u3081\u308b\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>kernel /ˈkɜrnəl/：穀物の粒。</li><li>burst /bɜrst/：はじける、破裂する。</li><li>void /vɔɪd/：空虚、空白。fill the void は心の空白を埋める。</li></ul><div style="text-align:center;margin:26px 0 12px"><button id="random-work" type="button" style="font:inherit;padding:12px 28px;border:1px solid #c9bca9;border-radius:8px;background:#e9dfce;color:#39342e;cursor:pointer">🔀 次の作品へ <small>Random Next</small></button><p id="random-status" role="status"></p></div><script>document.getElementById('random-work').addEventListener('click',async function(){this.disabled=true;try{const r=await fetch('/pandalife/works.json');if(!r.ok)throw Error();const rows=await r.json();const current=location.pathname.split('/').filter(Boolean).pop();const pool=rows.filter(w=>w.id!==current&&w.text?.some(Boolean)&&/^[A-Za-z0-9_-]+$/.test(w.id));if(!pool.length)throw Error();location.href='/pandalife/works/'+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)].id)+'/';}catch(e){document.getElementById('random-status').textContent='次の作品を読み込めませんでした。';this.disabled=false;}});</script><p><a href="/pandalife/?id=h-d78c9e6349b9c99_30">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
