<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おせち｜パンダの英語作品</title><meta name="description" content="👧　パンダちゃん、煮物の竹の子ばかりたべちゃだめだよ！ 🐼　正月くらい好きなだけ食べさせてよ！ 👧　Panda, don’t just pick out the bamboo shoots! 🐼　Hey, it’s New Year’s. Cut me some slack."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-48c36772973b209c_0/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>おせち</h1><img src="/pandalife/images/57814048dc66d5c83ac27b68337e5b35.webp" alt="おせち" loading="lazy"><p lang="ja">👧　パンダちゃん、煮物の竹の子ばかりたべちゃだめだよ！</p><p lang="ja">🐼　正月くらい好きなだけ食べさせてよ！</p><p lang="en">👧　Panda, don’t just pick out the bamboo shoots!</p><p lang="en">🐼　Hey, it’s New Year’s. Cut me some slack.</p><h2>英語学習ポイント</h2><ul><li>pick out /pɪk aʊt/：選び出す。ここでは竹の子だけを取り出す。</li><li>Cut me some slack.：少し大目に見てよ。くだけた慣用表現。</li></ul><p><a href="/pandalife/?id=h-48c36772973b209c_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
