sisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-46de7be3dcc9da99_0", "text": ["\ud83d\udc3c \u3058\u3083\u3042\u306a\u3001\u732b\u52a9..", "\ud83d\udc31 \u6c17\u3092\u3064\u3051\u3066\u3044\u304f\u30cb\u30e3..", "\ud83d\udc3c Goodbye, little buddy...", "\ud83d\udc31 Take care of yourself... meow."], "study": ["little buddy /\u02c8l\u026at\u0259l \u02c8b\u028cdi/\uff1a\u89aa\u3057\u3044\u76f8\u624b\u3078\u306e\u611b\u60c5\u306e\u3053\u3082\u3063\u305f\u547c\u3073\u304b\u3051\u3002", "Take care of yourself.\uff1a\u4f53\u306b\u6c17\u3092\u3064\u3051\u3066\u306d\u3002\u5225\u308c\u969b\u306b\u3082\u4f7f\u3048\u308b\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>little buddy /ˈlɪtəl ˈbʌdi/：親しい相手への愛情のこもった呼びかけ。</li><li>Take care of yourself.：体に気をつけてね。別れ際にも使える。</li></ul><div style="text-align:center;margin:26px 0 12px"><button id="random-work" type="button" style="font:inherit;padding:12px 28px;border:1px solid #c9bca9;border-radius:8px;background:#e9dfce;color:#39342e;cursor:pointer">🔀 次の作品へ <small>Random Next</small></button><p id="random-status" role="status"></p></div><script>document.getElementById('random-work').addEventListener('click',async function(){this.disabled=true;try{const r=await fetch('/pandalife/works.json');if(!r.ok)throw Error();const rows=await r.json();const current=location.pathname.split('/').filter(Boolean).pop();const pool=rows.filter(w=>w.id!==current&&w.text?.some(Boolean)&&/^[A-Za-z0-9_-]+$/.test(w.id));if(!pool.length)throw Error();location.href='/pandalife/works/'+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)].id)+'/';}catch(e){document.getElementById('random-status').textContent='次の作品を読み込めませんでした。';this.disabled=false;}});</script><p><a href="/pandalife/?id=h-46de7be3dcc9da99_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
