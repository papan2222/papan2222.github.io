v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-826c87a7d1b17dc_40", "text": ["\u7121\u5fc3\u3067\u30dd\u30c6\u30c1\u3001\u5fc3\u306f\u7121\u6575\u3002", "Mindless chips, heart undefeated."], "study": ["mindless /\u02c8ma\u026andl\u0259s/\uff1a\u4f55\u3082\u8003\u3048\u306a\u3044\u3001\u7121\u5fc3\u306e\u3002", "undefeated /\u02cc\u028cnd\u026a\u02c8fit\u026ad/\uff1a\u7121\u6557\u306e\u3001\u8ca0\u3051\u3066\u3044\u306a\u3044\u3002", "chips /t\u0283\u026aps/\uff1a\u7c73\u56fd\u82f1\u8a9e\u3067\u306f\u30dd\u30c6\u30c8\u30c1\u30c3\u30d7\u30b9\u3092\u6307\u3059\u3053\u3068\u304c\u591a\u3044\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>mindless /ˈmaɪndləs/：何も考えない、無心の。</li><li>undefeated /ˌʌndɪˈfitɪd/：無敗の、負けていない。</li><li>chips /tʃɪps/：米国英語ではポテトチップスを指すことが多い。</li></ul><p><a href="/pandalife/?id=h-826c87a7d1b17dc_40">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
