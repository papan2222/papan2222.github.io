<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶｜パンダの英語作品</title><meta name="description" content="忘れられたっていい。君に愛された記憶が、僕という存在のすべてだから。 If I am forgotten, your love becomes the fabric that remembers me."><link rel="canonical" href="https://papan2222.github.io/pandalife/works/h-2e0e3a027996b522_10/"><style>body{margin:24px auto;padding:0 16px;max-width:760px;font:17px/1.8 system-ui,sans-serif;background:#f5f0e7;color:#39342e}img{width:100%;height:auto;border-radius:12px}p{white-space:pre-wrap}a{color:#285c87}</style></head><body><nav><a href="/pandalife/">作品一覧</a> · <a href="/">ホーム</a></nav><main><h1>記憶</h1><img src="/pandalife/images/913d7f2105792d89b0faaaf9971de843.webp" alt="記憶" loading="lazy"><p lang="ja">忘れられたっていい。君に愛された記憶が、僕という存在のすべてだから。</p><p lang="en">If I am forgotten,</p><p lang="en">your love becomes the fabric</p><p lang="en">that remembers me.</p><h2>英語学習ポイント</h2><ul><li>forgotten /fərˈɡɑtən/：忘れられた。forget の過去分詞。</li><li>fabric /ˈfæbrɪk/：布、生地。ここでは愛を自分を形作る布にたとえる。</li></ul><p><a href="/pandalife/?id=h-2e0e3a027996b522_10">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
