andaAudio?.play(text,rate,status)){activeStatus=status;return;}if(!supported){status.textContent='音声を利用できません。';return;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}document.getElementById("work-audio").append(audioControls({"id": "h-410ff5a4a7f9b29d_0", "text": ["\u304d\u3087\u3046\u306e\u30b7\u30c1\u30e5\u30fc\u306b\u306f\u3001\u306b\u3093\u3058\u3093\u3092\u305f\u304f\u3055\u3093\u5165\u308c\u3088\u3046\u3002\u5e02\u5834\u3067\u826f\u3044\u91ce\u83dc\u304c\u624b\u306b\u5165\u308a\u307e\u3057\u305f\u3002", "We'll put lots of carrots in today's stew. We found some good vegetables at the market."], "study": ["stew /stu/\uff1a\u30b7\u30c1\u30e5\u30fc\u3001\u716e\u8fbc\u307f\u6599\u7406\u3002", "carrot /\u02c8k\u00e6r\u0259t/\uff1a\u30cb\u30f3\u30b8\u30f3\u3002", "market /\u02c8m\u0251rk\u0259t/\uff1a\u5e02\u5834\u3002"]}));window.addEventListener("pagehide",stopSpeech);</script><h2>英語学習ポイント</h2><ul><li>stew /stu/：シチュー、煮込み料理。</li><li>carrot /ˈkærət/：ニンジン。</li><li>market /ˈmɑrkət/：市場。</li></ul><div style="text-align:center;margin:26px 0 12px"><button id="random-work" type="button" style="font:inherit;padding:12px 28px;border:1px solid #c9bca9;border-radius:8px;background:#e9dfce;color:#39342e;cursor:pointer">🔀 次の作品へ <small>Random Next</small></button><p id="random-status" role="status"></p></div><script>document.getElementById('random-work').addEventListener('click',async function(){this.disabled=true;try{const r=await fetch('/pandalife/works.json');if(!r.ok)throw Error();const rows=await r.json();const current=location.pathname.split('/').filter(Boolean).pop();const pool=rows.filter(w=>w.id!==current&&w.text?.some(Boolean)&&/^[A-Za-z0-9_-]+$/.test(w.id));if(!pool.length)throw Error();location.href='/pandalife/works/'+encodeURIComponent(pool[Math.floor(Math.random()*pool.length)].id)+'/';}catch(e){document.getElementById('random-status').textContent='次の作品を読み込めませんでした。';this.disabled=false;}});</script><p><a href="/pandalife/?id=h-410ff5a4a7f9b29d_0">ギャラリーで作品を見る・音声を聞く</a></p></main></body></html>
