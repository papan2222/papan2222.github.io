<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パンダの詩と小さな物語｜Panda Life</title><meta name="description" content="パンダのいる日々を描くイラストと短い英語のことば、日本語訳、英語学習コンテンツを楽しめるギャラリー。"><link rel="canonical" href="https://papan2222.github.io/pandalife/"><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#39342e;font:16px/1.7 system-ui,sans-serif}header{text-align:center;padding:28px 12px}h1{font: bold 42px Georgia;margin:8px}a{color:inherit}main{max-width:1100px;margin:auto;padding:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}input,select,button{font:inherit;padding:8px;border:1px solid #c9bca9;border-radius:8px;background:white;color:inherit}input{flex:1;min-width:150px}#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.work{display:block;text-decoration:none;background:white;border-radius:12px;overflow:hidden;text-align:center;box-shadow:0 2px 8px #0001}.work img{width:100%;height:auto;object-fit:contain;display:block}.work a{display:block;text-decoration:none}.copy,.learn{padding:12px 15px;text-align:left;overflow-wrap:anywhere;font-size:15px;line-height:1.65}.copy p,.learn p{margin:0 0 8px;white-space:pre-wrap}.copy p:last-child{margin-bottom:0}.learn{border-top:1px solid #eee}.learn summary{cursor:pointer;font-weight:bold}#gallery{align-items:start}@media(max-width:850px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#gallery{grid-template-columns:1fr}header{padding:12px}h1{font-size:30px}main{padding:12px 4px}.copy,.learn{font-size:16px}}dialog{width:min(720px,95vw);max-height:92vh;border:0;border-radius:16px;padding:16px;background:#fffaf2;color:inherit}dialog::backdrop{background:#000a}dialog img{width:100%;max-height:55vh;object-fit:contain}dialog p{white-space:pre-wrap;margin:5px 0}#close{float:right}#study{border-top:1px solid #c9bca9;margin-top:18px;padding-top:10px}body:has(dialog[open]){overflow:hidden}.audio-trial{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;align-items:center;text-align:left;border-top:1px solid #eee}.audio-trial button{font-size:14px;cursor:pointer}.audio-trial span{font-size:13px;width:100%}</style><header><a href="../">ホーム</a><h1>Panda Life</h1><div>パンダのいる日々。ことばと小さな物語。</div></header><main><div class="tools"><input id="search" placeholder="英単語で検索"><select id="order"><option value="random">ランダム</option><option value="original">登録順</option></select></div><p id="status" role="status">読み込み中…</p><div id="gallery"></div></main><dialog id="detail"><button id="close" aria-label="閉じる">閉じる ×</button><div id="pictures"></div><div id="words"></div><section id="study"></section><button id="share">URLをコピー</button><span id="copied" role="status"></span></dialog><script src="/audio/player.js"></script><script>const $=id=>document.getElementById(id);let works=[],random=[];const d=$('detail');let activeSpeech,activeStatus;function stopSpeech(){window.PandaAudio?.stop();if('speechSynthesis' in window)window.speechSynthesis.cancel();if(activeStatus)activeStatus.textContent='';activeSpeech=null}function audioControls(w){const box=document.createElement('div');box.className='audio-trial';const status=document.createElement('span');status.setAttribute('role','status');const supported='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;function speak(text,rate){if(!text)return;stopSpeech();if(window.PandaAudio?.play(text,rate,status)){activeStatus=status;return;}if(!supported){status.textContent='音声を利用できません。';return;}stopSpeech();const u=new SpeechSynthesisUtterance(text);activeSpeech=u;activeStatus=status;u.lang='en-US';u.rate=rate;const voices=window.speechSynthesis.getVoices();const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;u.onstart=()=>{if(activeSpeech===u)status.textContent='再生中…'};u.onend=()=>{if(activeSpeech===u)status.textContent=''};u.onerror=e=>{if(activeSpeech===u&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='音声を再生できませんでした。'};window.speechSynthesis.speak(u)}const english=w.text.flatMap(t=>t.split(/\n/)).map(t=>t.replace(/^.*[ぁ-んァ-ヶ一-龯々]/u,'').replace(/^[^A-Za-z“‘"']+/u,'').trim()).filter(t=>/[A-Za-z]{2}/.test(t)&&!/[ぁ-んァ-ヶ一-龯]/u.test(t)).join('\n');function button(parent,label,fn){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;parent.append(b)}button(box,'🔊 英語を聞く',()=>speak(english,1));button(box,'ゆっくり',()=>speak(english,.75));button(box,'停止',stopSpeech);const terms=[...new Set((w.study||[]).flatMap(t=>Array.from(t.matchAll(/(?:^|[。；;]\s*)([A-Za-z][A-Za-z’' -]*?)\s*\/[^/\n]+\/\s*[:：]/g),m=>m[1].trim())))];const extras={'h-e0ee56bfaf337c0_19':['Come on!','catch the sunset','wait for'],'h-366ce776b8a4e661_0':['treat','You’ve grown'],'h-a25009e0949598e_0':['little brother','look just like'],'h-21d91d400625dbb8_0':['Holding your hand','grab some'],'h-34d4bc6ef1b0fe11_0':['be leaving','hold this moment tight','believe']};if(!terms.length)terms.push(...(extras[w.id]||[]));if(terms.length){const details=document.createElement('details');details.style.width='100%';const summary=document.createElement('summary');summary.textContent='英単語・熟語の音声';details.append(summary);const buttons=document.createElement('div');buttons.style.cssText='display:flex;flex-wrap:wrap;gap:6px;padding-top:6px';for(const term of terms)button(buttons,'🔊 '+term,()=>speak(term,1));details.append(buttons);box.append(details)}box.append(status);return box}function render(){stopSpeech();const q=$('search').value.toLowerCase().trim();const list=($('order').value==='random'?random:works).filter(w=>[...w.text,...(w.study||[])].join(' ').toLowerCase().includes(q));$('status').textContent=list.length+' 作品';$('gallery').replaceChildren();for(const w of list){const card=document.createElement('article');card.className='work';const a=document.createElement('a');a.href='?id='+encodeURIComponent(w.id);const im=document.createElement('img');im.src=w.images[0];im.loading='lazy';im.alt=w.title;const t=document.createElement('div');t.className='copy';for(const line of w.text){const p=document.createElement('p');p.textContent=line;t.append(p)}a.append(im,t);a.onclick=e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();history.pushState({detail:true},'',a.href);sync()};card.append(a);card.append(audioControls(w));if(w.study?.length){const details=document.createElement('details');details.className='learn';const summary=document.createElement('summary');summary.textContent='英語学習ポイント';details.append(summary);for(const line of w.study){const p=document.createElement('p');p.textContent=line;details.append(p)}card.append(details)}$('gallery').append(card)}}function sync(){stopSpeech();const w=works.find(w=>w.id===new URL(location.href).searchParams.get('id'));if(!w){if(d.open)d.close();return}$('pictures').replaceChildren();for(const src of w.images){const im=document.createElement('img');im.src=src;im.alt=w.title;$('pictures').append(im)}$('words').replaceChildren();for(const line of w.text){const p=document.createElement('p');p.textContent=line;$('words').append(p)}$('words').append(audioControls(w));$('study').replaceChildren();if(w.study?.length){const h=document.createElement('h3');h.textContent='英語学習ポイント';$('study').append(h);for(const line of w.study){const p=document.createElement('p');p.textContent=line;$('study').append(p)}}$('study').hidden=!w.study?.length;$('copied').textContent='';if(!d.open)d.showModal();d.scrollTop=0}function close(){if(history.state?.detail)history.back();else{const u=new URL(location.href);u.searchParams.delete('id');history.replaceState(null,'',u);sync()}}$('close').onclick=close;d.oncancel=e=>{e.preventDefault();close()};window.onpopstate=sync;$('search').oninput=render;$('order').onchange=render;$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copied').textContent=' コピーしました'}catch{prompt('URLをコピー',location.href)}};fetch('works.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{works=a;random=[...a];for(let i=random.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[random[i],random[j]]=[random[j],random[i]]}render();sync()}).catch(()=>{$('status').textContent='作品データの準備中です。'});</script></html>
