<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>どうぶつ英単語｜イラストで学ぶTOEIC600基礎英語</title><meta name="description" content="動物のイラストと英文例文、日本語訳、品詞、発音記号で基礎英単語を学習。TOEIC600を目指そう。"><link rel="canonical" href="https://papan2222.github.io/animalenglish/"><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#39342e;font:16px/1.7 system-ui,sans-serif}header{text-align:center;padding:24px 12px}a{color:#285c87}main{max-width:1100px;margin:auto;padding:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}input,button{font:inherit;padding:8px;border:1px solid #c9bca9;border-radius:8px;background:white;color:inherit}input{flex:1;min-width:150px}button{cursor:pointer}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}article{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}article img{width:100%;height:auto;display:block}.copy{padding:12px 16px}h2{margin:0;font-size:26px}p{margin:6px 0}article[hidden]{display:none}#wordlist{background:white;padding:12px;border-radius:10px;margin-bottom:16px}#wordlist summary{cursor:pointer;font-weight:bold}#wordlist ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;max-height:360px;overflow:auto}.number{font-size:14px;color:#75634f;font-weight:bold}article{scroll-margin-top:12px}.pager{display:flex;gap:8px;align-items:center;margin:12px 0}.pager select{font:inherit;padding:8px;border:1px solid #c9bca9;border-radius:8px;background:white}button:disabled{opacity:.45} </style></head><body><header><a href="/">ホーム</a><h1>どうぶつ英単語</h1><p>めざせTOEIC600!</p><p>Oxford 3000の基本約1700語をベースに単語を紹介。</p></header><main><details id="wordlist"><summary>英単語一覧（指定順）</summary><ol><!-- WORDLIST --></ol></details><div class="tools"><input id="search" aria-label="英単語・日本語・番号で検索" placeholder="英単語・日本語・番号で検索"><button id="shuffle">ランダム</button><button id="reset">番号順</button><button id="stop">音声停止</button></div><p id="status" role="status">160件</p><nav class="pager" aria-label="ページ移動"><button id="prev">前へ</button><select id="page" aria-label="ページ番号"></select><button id="next">次へ</button></nav><div id="gallery"><!-- CARDS --></div><p>もっと英単語を学びたい方へ：<a href="https://www.amazon.co.jp/dp/B0FDW792M5">英単語300 - 動物たちと楽しく！（Kindle）</a></p></main><script>const g=document.getElementById('gallery'),cards=[...g.children],q=document.getElementById('search'),pageSelect=document.getElementById('page');let order=[...cards],page=0;const size=50;function matches(c){const s=q.value.trim().toLowerCase(),n=s.match(/^(?:no\.?\s*)?(\d+)$/i);return n?c.querySelector('.number').textContent.match(/^No\.(\d+)/)[1]===String(Number(n[1])):c.textContent.toLowerCase().includes(s)}function render(){const a=order.filter(matches),total=Math.max(1,Math.ceil(a.length/size));page=Math.max(0,Math.min(page,total-1));const visible=new Set(a.slice(page*size,(page+1)*size));for(const c of order)c.hidden=!visible.has(c);g.append(...order);pageSelect.replaceChildren(...Array.from({length:total},(_,i)=>new Option((i+1)+' / '+total,i)));pageSelect.value=page;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=total-1;document.getElementById('status').textContent=a.length+'件（'+(a.length?page*size+1:0)+'〜'+Math.min((page+1)*size,a.length)+'件を表示）'}q.oninput=()=>{page=0;render()};pageSelect.onchange=()=>{page=Number(pageSelect.value);render()};document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};document.getElementById('shuffle').onclick=()=>{order=[...cards];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}page=0;render()};document.getElementById('reset').onclick=()=>{order=[...cards];q.value='';page=0;render()};function jump(id){const i=cards.findIndex(c=>c.id===id);if(i<0)return;q.value='';order=[...cards];page=Math.floor(i/size);render();requestAnimationFrame(()=>document.getElementById(id).scrollIntoView())}document.getElementById('wordlist').onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();location.hash=a.hash;jump(a.hash.slice(1))}};window.addEventListener('hashchange',()=>jump(location.hash.slice(1)));render();if(location.hash)jump(location.hash.slice(1));const player=new Audio();player.preload='none';document.getElementById('stop').onclick=()=>{player.pause();player.currentTime=0;window.speechSynthesis?.cancel()};g.onclick=e=>{const b=e.target.closest('.speak');if(!b)return;player.pause();window.speechSynthesis?.cancel();player.src=b.dataset.audio;player.play().catch(()=>fallback(b));};function fallback(b){if(!('speechSynthesis' in window)){alert('このブラウザは音声再生に対応していません');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.word);u.lang='en-GB';speechSynthesis.speak(u)};</script></body></html>
